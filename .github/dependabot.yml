version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns:
          - "@opencode/plugin"
          - "expo-device-hub"
          - "yaml"
      tooling:
        patterns: ["*"]
        exclude-patterns:
          - "@opencode/plugin"
          - "expo-device-hub"
          - "yaml"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
