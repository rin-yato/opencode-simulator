name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize releases. A push that lands during a release runs after it and
# releases from the latest main, not from the older commit that triggered it.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      # Trusted publishing needs npm 11.5.1 or later, which Node 22 does not ship.
      # No registry-url: it would add a placeholder token that OIDC does not use.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # npm authenticates with OIDC, so there is no token. The filename must match
      # the trusted publisher on npmjs.com. Private repos get no provenance.
      - name: Version and publish
        run: bash scripts/release.sh
