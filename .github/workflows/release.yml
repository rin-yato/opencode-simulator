name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize releases. A push that lands during a release runs after it and
# releases from the latest main, not from the older commit that triggered it.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Add an NPM_TOKEN repository secret with publish access to opencode-simulator."
            exit 1
          fi
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error::NPM_TOKEN is invalid, expired, or lacks the bypass-2FA permission."
            exit 1
          fi

      - name: Version and publish
        # Provenance is not added: npm does not generate it from a private source
        # repository. Move to npm trusted publishing when this repo is public.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/release.sh
